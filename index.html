<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOIVI | Joias que revelam sua essência</title>

    <link rel="stylesheet" href="style.css">
    
  
</head>

<body>

   
<header class="cabecalho">

    <!-- Parte superior do cabeçalho -->
    <div class="topo">

        <!-- Logo -->
 <div class="logo">
    <span>JO</span>
    <img src="img/flor.png" alt="" class="logo-flor">
    <span>VI</span>
 </div>

        <!-- Barra de pesquisa -->
        <div class="pesquisa">
            <input type="text" placeholder="O que você está procurando?">
            <button aria-label="Pesquisar">⌕</button>
        </div>

        <!-- Ícones -->
        <div class="icones">

            <a href="#" aria-label="Favoritos"><img src="img/favorito.png"></a>

            <a href="#" aria-label="Sacola"><img src="img/sacola.png"></a>

            <a href="#" aria-label="Minha conta"><img src="img/conta.png"></a>

        </div>

    </div>

    <!-- Menu de categorias -->
    <nav class="menu">

        <a href="#">Colares</a>
        <a href="#">Anéis</a>
        <a href="#">Brincos</a>
        <a href="#">Kits</a>
        <a href="#">Promoções</a>
        <a href="#">Em alta</a>

    </nav>


<!-- BANNER -->

<section class="banner-principal">
    <img src="img/banner.png" alt="Joias que revelam sua essência">
</section>

<!-- BANNER INFERIOR -->

 <section class="banner-inferior">
    <img src="img/banner2.png" alt="Joias que revelam sua essência">
</section>

<!-- ANEIS -->


<section class="colecao">

    <!-- Primeira fileira de produtos -->
    <div class="produtos-destaque">

        <div class="produto-destaque">
            <img src="img/anel-charlotte.png" alt="Anel Charlotte">
            <h3>Anel Charlotte</h3>
            <p>R$ 65,00</p>
        </div>

        <div class="produto-destaque">
            <img src="img/anel-elegante.png" alt="Anel Elegante">
            <h3>Anel Elegante</h3>
            <p>R$ 60,00</p>
        </div>

        <div class="produto-destaque">
            <img src="img/anel-imperatriz.png" alt="Anel Imperatriz">
            <h3>Anel Imperatriz</h3>
            <p>R$ 70,00</p>
        </div>

        <div class="produto-destaque">
            <img src="img/anel-serena.png" alt="Anel Serena">
            <h3>Anel Serena</h3>
            <p>R$ 61,00</p>
        </div>

    </div>

    <!-- Divisor decorativo -->
    <div class="divisor">
        <span></span>
        <div class="flor-divisora">✧</div>
        <span></span>
    </div>

    <!-- Segunda fileira de produtos -->
    <div class="produtos-cards">

        <div class="card-produto">
            <img src="img/produto-1.png" alt="Anel de pedra">
            <a href="#">Ver produto <span>→</span></a>
        </div>

        <div class="card-produto">
            <img src="img/produto-2.png" alt="Colar com pingente">
            <a href="#">Ver produto <span>→</span></a>
        </div>

        <div class="card-produto">
            <img src="img/produto-3.png" alt="Anel delicado">
            <a href="#">Ver produto <span>→</span></a>
        </div>

        <div class="card-produto">
            <img src="img/produto-4.png" alt="Brincos">
            <a href="#">Ver produto <span>→</span></a>
        </div>

    </div>

</section>


  <!-- CARROSSEL -->


<section class="carrossel">

    <div class="slides">

        <div class="slide ativo">
            <img src="img/banner-1.png" alt="Elegância em cada detalhe">
        </div>

        <div class="slide">
            <img src="img/banner-1.png" alt="Joias para todos os momentos">
        </div>

        <div class="slide">
            <img src="img/banner-1.png" alt="Realce sua essência">
        </div>

    </div>

    <!-- Setas -->
    <button class="seta anterior" onclick="mudarSlide(-1)">
        &#10094;
    </button>

    <button class="seta proximo" onclick="mudarSlide(1)">
        &#10095;
    </button>

    <!-- Indicadores -->
    <div class="indicadores">
        <span class="ponto ativo" onclick="irParaSlide(0)"></span>
        <span class="ponto" onclick="irParaSlide(1)"></span>
        <span class="ponto" onclick="irParaSlide(2)"></span>
    </div>

</section>


<script src="script.js"></script>

</body>

</header>
